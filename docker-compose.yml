services:
  ros-dev:
    # Image parameterized by ROS_DISTRO (default: jazzy)
    image: adyansh04/ros-dev:${ROS_DISTRO:-jazzy}
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        BASE_IMAGE: adyansh04/ros-dev:${ROS_DISTRO:-jazzy}

    # Keep the container running and attachable
    tty: true
    stdin_open: true

    # Container name includes the ROS distro for clarity
    container_name: ros_dev_${ROS_DISTRO:-jazzy}

    # Persistent host mounts using long (object) syntax
    volumes:
      - type: bind
        source: ./workspace
        target: /root/workspace
        read_only: false
      - type: bind
        source: ./.vscode
        target: /root/workspace/.vscode
        read_only: false
      - type: bind
        source: ./.clangd
        target: /root/workspace/.clangd
      - type: bind
        source: ./.clang-format
        target: /root/workspace/.clang-format
      - type: bind
        source: ./ruff.toml
        target: /root/workspace/ruff.toml
      - type: bind
        source: ./data
        target: /root/data
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: false
      - type: bind
        source: ~/.ssh
        target: /root/.ssh
        read_only: true

    # Hardware, networking, and IPC settings suitable for dev workflows
    privileged: true
    network_mode: "host"
    ipc: host
    pid: host

    # GPU support with Compose (requires Docker Compose v2.3+ and NVIDIA Container Toolkit on host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # GUI environment
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DISTRO=${ROS_DISTRO:-jazzy}
