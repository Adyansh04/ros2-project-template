# ruff.toml
# This file configures the Ruff linter and formatter for Python.

# Set the maximum line length.
line-length = 100

# Enable the isort import sorter.
[lint.isort]
known-first-party = ["my_package"] # Add your package names here

# Define the rules Ruff should check for.
# See the Ruff documentation for a full list of rules: [https://docs.astral.sh/ruff/rules/](https://docs.astral.sh/ruff/rules/)
[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]

ignore = [
    "E501", # line too long, handled by the formatter
]
